{% load static %}
<nav class="navbar" aria-label="Primary navigation">
    <div class="container nav-inner">
        <a class="brand" href="{% url 'website:home' %}" aria-label="Aynal Haque home">
            <span class="brand-mark"><img src="{% static 'images/aynal-logo.png' %}" alt="Aynal Haque logo"></span>
            <span>
                <span class="brand-title">Aynal Haque</span>
                <span class="brand-subtitle">Backend Engineering Platform</span>
            </span>
        </a>

        <button id="mobile-menu-button" class="nav-toggle" type="button" aria-controls="mobile-menu" aria-expanded="false">
            <i class="bi bi-list"></i>
        </button>

        <div id="mobile-menu" class="nav-links">
            <a class="nav-link {% if request.resolver_match.namespace == 'website' and request.resolver_match.url_name == 'home' %}is-active{% endif %}" href="{% url 'website:home' %}">Home</a>
            <a class="nav-link {% if request.resolver_match.url_name == 'about' %}is-active{% endif %}" href="{% url 'website:about' %}">About</a>
            <a class="nav-link {% if request.resolver_match.url_name == 'expertise' %}is-active{% endif %}" href="{% url 'website:expertise' %}">Expertise</a>
            <a class="nav-link" href="{% url 'website:home' %}#projects">Projects</a>
            <a class="nav-link {% if request.resolver_match.namespace == 'contact' %}is-active{% endif %}" href="{% url 'contact:contact' %}">Contact</a>
            {% if user.is_authenticated %}
                <a class="nav-link {% if request.resolver_match.url_name == 'profile' %}is-active{% endif %}" href="{% url 'accounts:profile' %}">Profile</a>
                <a class="nav-link" href="{% url 'accounts:logout' %}">Logout</a>
            {% else %}
                <a class="nav-link {% if request.resolver_match.url_name == 'login' %}is-active{% endif %}" href="{% url 'accounts:login' %}">Login</a>
            {% endif %}
        </div>

        <div class="nav-actions">
            <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme">
                <i class="bi bi-moon"></i>
            </button>
            {% if user.is_authenticated %}
                <a class="btn btn-secondary" href="{% url 'accounts:profile' %}"><i class="bi bi-person"></i>Profile</a>
            {% else %}
                <a class="btn btn-primary" href="{% url 'contact:contact' %}"><i class="bi bi-send"></i>Start a Project</a>
            {% endif %}
        </div>
    </div>
</nav>
